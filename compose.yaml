# Set API_KEY in .env or the environment before running Compose.
# First setup: docker compose run --build --rm model-download && docker compose up --build -d picker
# Later starts: docker compose up --build -d picker
# Stop: docker compose down (the host model directory is preserved).
# Builds use the local engine's CPU architecture; emulation can fail or be slow.
services:
  model-download:
    profiles: [setup]
    build:
      context: .
      dockerfile: docker/model-download.Dockerfile
    # Keep this revision in sync with the native `make model` command.
    command:
      - receptron/laya-onnx
      - --revision
      - 68f27dfe5a27a54fb2b1fefc432f43f972e90868
      - --local-dir
      - /models
    volumes:
      - type: bind
        source: ${MODEL_DIR:-./inference/model}
        target: /models
        bind:
          create_host_path: true
  picker:
    build: .
    stop_grace_period: 35s
    ports:
      - "8080:8080"
    environment:
      API_KEY: ${API_KEY:?Set a non-empty API_KEY in .env or the environment}
      CONFIG_PATH: /app/config.yaml
      MODEL_DIR: /models
      LISTEN_ADDR: :8080
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-60s}
    volumes:
      - type: bind
        source: ${MODEL_DIR:-./inference/model}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONFIG_PATH:-./config.yaml}
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
